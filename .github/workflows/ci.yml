name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        run: go test ./...
      - name: Cross-compile npm binaries
        run: make dist
      - name: Smoke CLI help
        run: |
          node npm/nerm-cli/bin/nerm.js --help
          node npm/nerm-cli/bin/nerm.js version
