[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerm-agent"
version = "0.1.0"
description = "Platform-agnostic NERM MCP agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp",
  "httpx",
  "pydantic>=2",
  "pydantic-settings>=2",
  "python-dotenv",
  "tenacity",
  "cachetools",
  "redis",
  "orjson",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "respx",
  "anyio",
  "freezegun",
  "ruff",
  "mypy",
]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
markers = [
  "integration: integration tests including optional real-tenant checks",
]
